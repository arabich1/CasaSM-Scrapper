name: CSE Scraper

on:
  schedule:
    # Every 15 minutes from 9:00 to 16:00 Mon-Fri (Africa/Casablanca)
    - cron: "0,15,30,45 9-16 * * 1-5"

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml certifi

      - name: Run scraper
        run: |
          python casablanca_scraper.py \
            --url "https://www.casablanca-bourse.com/fr/live-market/marche-actions-groupement" \
            --output cse_groupement.csv \
            --once \
            --tz Africa/Casablanca

      - name: Commit CSV
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add cse_groupement.csv
          git commit -m "Update CSV [skip ci]" || echo "No changes"
          git push
